{{- if .Values.shortcut.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shortcut.fullname" . }}
  labels:
    {{- include "shortcut.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.shortcut.replicaCount }}
  selector:
    matchLabels:
      {{- include "shortcut.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shortcut.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/shortcut/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/shortcut/secret.yaml") . | sha256sum }}
        {{- with .Values.shortcut.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.shortcut.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: shortcut
          image: "{{ .Values.shortcut.image.repository }}:{{ .Values.shortcut.image.tag }}"
          imagePullPolicy: {{ .Values.shortcut.image.pullPolicy }}
          args:
            - "-graphconfigs"
            - {{ .Values.shortcut.graphConfigsPath | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.shortcut.service.httpPort }}
            - name: metrics
              containerPort: {{ .Values.shortcut.service.metricsPort }}
          env:
            - name: ENV
              value: {{ .Values.shortcut.env | quote }}
            - name: CONFIGS_DIR
              value: /app/configs/shortcut
          volumeMounts:
            - name: config
              mountPath: /app/configs/shortcut
              readOnly: true
            - name: graphs
              mountPath: {{ .Values.shortcut.graphConfigsPath }}
              readOnly: true
          resources:
            {{- toYaml .Values.shortcut.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          projected:
            sources:
              - configMap:
                  name: {{ include "shortcut.fullname" . }}-config
              - secret:
                  name: {{ include "shortcut.fullname" . }}-db
        - name: graphs
          configMap:
            name: {{ include "shortcut.fullname" . }}-graphs
      {{- with .Values.shortcut.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.shortcut.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.shortcut.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
