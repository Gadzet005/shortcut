services:
  mongo:
    image: mongo:8
    command: ["mongod", "--quiet", "--logpath", "/dev/null"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shortcut
      POSTGRES_PASSWORD: shortcut
      POSTGRES_DB: shortcut
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortcut -d shortcut"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  shortcut:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["-graphconfigs", "/app/demo/configs"]
    volumes:
      - ./configs:/app/demo/configs:ro
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  user-service:
    build:
      context: ..
      dockerfile: demo/services/user-service/Dockerfile
    environment:
      ENV: dev
    ports:
      - "9101:9101"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  mongo-data:
  postgres-data:
