app:
  shutdown-timeout: 10s

http:
  port: 8080

metrics:
  http:
    port: 2112

logs:
  path: logs/shortcut.log

mongo:
  uri: "mongodb://localhost:27017"
  database: "shortcut"

cache:
  addr: "localhost:6379"

postgres:
  url: "postgres://shortcut:shortcut@localhost:5432/shortcut?sslmode=disable"

failure-worker:
  interval: 5s
  batch-size: 32
  visibility-timeout: 30s
