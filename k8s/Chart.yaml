apiVersion: v2
name: shortcut
description: Shortcut application with full observability stack
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: prometheus
    version: 25.x.x
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled
  - name: grafana
    version: 8.x.x
    repository: https://grafana.github.io/helm-charts
    condition: grafana.enabled
  - name: loki
    version: 6.x.x
    repository: https://grafana.github.io/helm-charts
    condition: loki.enabled
