apiVersion: v2
name: shortcut
description: Shortcut orchestrator with full observability stack and dependencies
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: kube-prometheus-stack
    version: "65.5.1"
    repository: https://prometheus-community.github.io/helm-charts
    condition: kube-prometheus-stack.enabled

  - name: loki
    version: "6.7.1"
    repository: https://grafana.github.io/helm-charts
    condition: loki.enabled

  - name: promtail
    version: "6.15.0"
    repository: https://grafana.github.io/helm-charts
    condition: promtail.enabled
