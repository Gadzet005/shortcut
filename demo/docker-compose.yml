services:
  mongo:
    image: mongo:8
    command: ["mongod", "--quiet", "--logpath", "/dev/null"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shortcut
      POSTGRES_PASSWORD: shortcut
      POSTGRES_DB: shortcut
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortcut -d shortcut"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  shortcut:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["-graphconfigs", "/app/demo/configs"]
    volumes:
      - ./configs:/app/demo/configs:ro
    ports:
      - "8080:8080"
      - "2112:2112"
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ../tests/infra/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ../tests/infra/grafana/datasources:/etc/grafana/provisioning/datasources
      - ../tests/infra/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana-storage:/var/lib/grafana
      - ../k8s/dashboards:/var/lib/grafana/dashboards/shortcut
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.4.2
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ../tests/infra/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:3.4.2
    container_name: promtail
    volumes:
      - ../tests/infra/promtail-config.yaml:/etc/promtail/config.yaml
      - ..:/host/project:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki

  user-service:
    build:
      context: ..
      dockerfile: demo/services/user-service/Dockerfile
    environment:
      ENV: dev
      MOCK_DATA_DIR: /app/mock-data
    volumes:
      - ./mock-data:/app/mock-data:ro
    ports:
      - "9101:9101"
    depends_on:
      postgres:
        condition: service_healthy

  product-service:
    build:
      context: ..
      dockerfile: demo/services/product-service/Dockerfile
    environment:
      ENV: dev
      MOCK_DATA_DIR: /app/mock-data
    volumes:
      - ./mock-data:/app/mock-data:ro
    ports:
      - "9102:9102"
    depends_on:
      postgres:
        condition: service_healthy

  recommendation-service:
    build:
      context: ..
      dockerfile: demo/services/recommendation-service/Dockerfile
    environment:
      ENV: dev
      MOCK_DATA_DIR: /app/mock-data
    volumes:
      - ./mock-data:/app/mock-data:ro
    ports:
      - "9103:9103"

  frontend-service:
    build:
      context: ..
      dockerfile: demo/services/frontend-service/Dockerfile
    environment:
      ENV: dev
      MOCK_DATA_DIR: /app/mock-data
    volumes:
      - ./mock-data:/app/mock-data:ro
    ports:
      - "9104:9104"
    depends_on:
      - shortcut
  
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true


volumes:
  mongo-data:
  postgres-data:
  grafana-storage:
  loki-data:
