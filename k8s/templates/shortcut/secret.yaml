{{- if .Values.shortcut.enabled }}
{{- $pg := .Values.shortcut.externalDatabases.postgres -}}
{{- $mongo := .Values.shortcut.externalDatabases.mongo -}}
{{- $valkey := .Values.shortcut.externalDatabases.valkey -}}
{{- $pgUser := ternary .Values.postgresql.auth.username $pg.username .Values.postgresql.enabled -}}
{{- $pgPass := ternary .Values.postgresql.auth.password $pg.password .Values.postgresql.enabled -}}
{{- $pgDB := ternary .Values.postgresql.auth.database $pg.database .Values.postgresql.enabled -}}
{{- $pgPort := ternary 5432 (int $pg.port) .Values.postgresql.enabled -}}
{{- $mongoPort := ternary 27017 (int $mongo.port) .Values.mongodb.enabled -}}
{{- $valkeyPort := ternary 6379 (int $valkey.port) .Values.valkey.enabled -}}
{{- $postgresURL := printf "postgres://%s:%s@%s:%d/%s?sslmode=disable" $pgUser $pgPass (include "shortcut.postgresHost" .) (int $pgPort) $pgDB -}}
{{- $mongoURI := printf "mongodb://%s:%d" (include "shortcut.mongoHost" .) (int $mongoPort) -}}
{{- $valkeyAddr := printf "%s:%d" (include "shortcut.valkeyHost" .) (int $valkeyPort) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shortcut.fullname" . }}-db
  labels:
    {{- include "shortcut.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.shortcut.env }}.yaml: |
    mongo:
      uri: {{ $mongoURI | quote }}
    postgres:
      url: {{ $postgresURL | quote }}
    cache:
      addr: {{ $valkeyAddr | quote }}
      password: {{ $valkey.password | quote }}
      db: {{ int $valkey.db }}
{{- end }}
